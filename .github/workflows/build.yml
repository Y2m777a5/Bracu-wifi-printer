name: Build Android APK with Gradle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Android Project & Gradle Wrapper
        run: flutter create --platforms=android --org com.bracu.wifiprinter .

      - name: Configure Gradle compileSdk Version
        run: |
          echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { compileSdk = 36 } } } }" >> android/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle || true

      - name: Build APK via Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bracu-wifi-printer-apk
          path: android/app/build/outputs/apk/release/*.apk
